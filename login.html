<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Gerencial | Mi Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261028j">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="config.js?v=20261028j"></script>
    <script src="utils.js?v=20261028j"></script>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <h1 class="login-logo">MI BAR</h1>
            <p class="login-subtitle">Panel de Control</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" class="input-stylish" placeholder="Tu usuario" autocomplete="username" pattern="[A-Za-z0-9._-]{3,40}" maxlength="40" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" autocomplete="current-password" class="input-stylish" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-big-action" id="btn-login">
                    INICIAR SESIÓN
                </button>
                
                <p id="error-msg" style="color:#ff5252; font-size:0.8rem; margin-top:20px; min-height:20px;"></p>
            </form>

            <a href="index.html" style="color:#666; font-size:0.8rem; text-decoration:none; display:block; margin-top:30px; border-top:1px solid #333; padding-top:15px;">
                ← Volver al Menú
            </a>
        </div>
    </div>

    <script src="login.js?v=20261029b"></script>
</body>
</html>
